<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#14161c">
<title>🚴 Велотрекер</title>
<link rel="manifest" href='data:application/manifest+json,{"name":"Велотрекер","short_name":"Вело","start_url":"./","display":"standalone","background_color":"%2314161c","theme_color":"%2314161c","icons":[{"src":"data:image/svg%2Bxml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 192 192%27%3E%3Crect width=%27192%27 height=%27192%27 rx=%2740%27 fill=%27%2322c55e%27/%3E%3Ctext x=%2796%27 y=%27130%27 font-size=%27110%27 text-anchor=%27middle%27%3E%F0%9F%9A%B4%3C/text%3E%3C/svg%3E","sizes":"192x192","type":"image/svg+xml"}]}'>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map { position: absolute; inset: 0; z-index: 1; background: #e8ece6; }
  .panel { position: absolute; left: 0; right: 0; bottom: 0; z-index: 1000; background: rgba(20, 22, 28, 0.94); backdrop-filter: blur(12px); color: #fff; border-radius: 22px 22px 0 0; padding: 14px 18px calc(14px + env(safe-area-inset-bottom)); box-shadow: 0 -8px 30px rgba(0,0,0,.35); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
  .stat { text-align: center; }
  .stat .val { font-size: 22px; font-weight: 700; letter-spacing: -.5px; }
  .stat .val small { font-size: 12px; font-weight: 500; opacity: .55; margin-left: 2px; }
  .stat .lbl { font-size: 10px; text-transform: uppercase; opacity: .55; margin-top: 2px; letter-spacing: .5px; }
  .btn { border: none; border-radius: 15px; padding: 16px; font-size: 16px; font-weight: 700; letter-spacing: .3px; color: #fff; cursor: pointer; transition: transform .1s; display: flex; align-items: center; justify-content: center; gap: 8px; }
  .btn:active { transform: scale(.97); }
  .btn.start { background: linear-gradient(135deg, #22c55e, #16a34a); width: 100%; }
  .btn.stop  { background: linear-gradient(135deg, #ef4444, #dc2626); }
  .btn.pause { background: linear-gradient(135deg, #f59e0b, #d97706); }
  .row { display: flex; gap: 10px; }
  .row .btn { flex: 1; }
  .gps-status { position: absolute; top: calc(10px + env(safe-area-inset-top)); left: 10px; z-index: 1000; padding: 7px 12px; border-radius: 11px; background: rgba(20,22,28,.85); backdrop-filter: blur(10px); color: #fff; font-size: 12px; display: flex; align-items: center; gap: 7px; max-width: 55vw; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: #f59e0b; flex-shrink: 0; }
  .dot.ok { background: #22c55e; box-shadow: 0 0 8px #22c55e; }
  .dot.err { background: #ef4444; }
  .float-btn { position: absolute; z-index: 1000; right: 10px; background: rgba(20,22,28,.9); backdrop-filter: blur(10px); color: #fff; border: none; border-radius: 12px; padding: 10px 12px; font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
  .float-btn:active { transform: scale(.94); }
  #histBtn { top: 82px; }
  #dlBtn { top: 130px; }
  #locBtn { top: 178px; }
  .toast { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); z-index: 2000; padding: 14px 22px; border-radius: 14px; background: rgba(20,22,28,.95); color: #fff; font-size: 14px; text-align: center; box-shadow: 0 10px 40px rgba(0,0,0,.5); max-width: 80vw; opacity: 0; pointer-events: none; transition: opacity .25s; white-space: pre-line; }
  .toast.show { opacity: 1; }
  .offline-bar { position: absolute; top: calc(10px + env(safe-area-inset-top)); right: 10px; z-index: 1000; padding: 7px 12px; border-radius: 11px; background: rgba(245,158,11,.9); color: #000; font-size: 12px; font-weight: 600; display: none; }
  .offline-bar.show { display: block; }
  .modal { position: fixed; inset: 0; z-index: 3000; background: rgba(10,11,15,.7); backdrop-filter: blur(6px); display: none; }
  .modal.show { display: block; }
  .modal-inner { position: absolute; left: 0; right: 0; bottom: 0; top: 40px; background: #14161c; color: #fff; border-radius: 22px 22px 0 0; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; }
  .modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .modal-head h2 { font-size: 20px; }
  .modal-head .actions { display: flex; gap: 8px; }
  .icon-btn { background: rgba(255,255,255,.08); border: none; color: #fff; border-radius: 10px; padding: 8px 12px; font-size: 14px; cursor: pointer; }
  .icon-btn:active { background: rgba(255,255,255,.18); }
  .trip-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .trip { background: rgba(255,255,255,.04); border-radius: 14px; padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: background .15s; }
  .trip:active { background: rgba(255,255,255,.1); }
  .trip .info { flex: 1; min-width: 0; }
  .trip .date { font-size: 13px; opacity: .6; }
  .trip .dist { font-size: 20px; font-weight: 700; margin: 2px 0; }
  .trip .meta { font-size: 12px; opacity: .6; }
  .trip .del { background: transparent; border: none; color: #ef4444; font-size: 18px; padding: 8px; cursor: pointer; }
  .empty { text-align: center; opacity: .5; padding: 40px 20px; font-size: 14px; }
</style>
</head>
<body>

<div id="map"></div>
<div class="gps-status"><span class="dot" id="dot"></span><span id="gpsText">Нажми «Старт»</span></div>
<div class="offline-bar" id="offlineBar">📴 Офлайн</div>

<button class="float-btn" id="histBtn" title="История">📋</button>
<button class="float-btn" id="dlBtn" title="Скачать карту">📥</button>
<button class="float-btn" id="locBtn" title="Центрировать">🎯</button>

<div class="toast" id="toast"></div>

<div class="modal" id="histModal">
  <div class="modal-inner">
    <div class="modal-head">
      <h2>📋 История</h2>
      <div class="actions">
        <button class="icon-btn" id="clearAll">Очистить</button>
        <button class="icon-btn" id="closeHist">✕</button>
      </div>
    </div>
    <div class="trip-list" id="tripList"></div>
  </div>
</div>

<div class="panel">
  <div class="stats">
    <div class="stat"><div class="val" id="dist">0<small>м</small></div><div class="lbl">Дистанция</div></div>
    <div class="stat"><div class="val" id="speed">0.0<small>км/ч</small></div><div class="lbl">Скорость</div></div>
    <div class="stat"><div class="val" id="time">00:00</div><div class="lbl">Время</div></div>
  </div>
  <div class="row" id="btnRow"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(e => console.warn('SW', e)); });
}

const TRANSPARENT = 'data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7';
const map = L.map('map', { zoomControl: false }).setView([55.751244, 37.618423], 14);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap', errorTileUrl: TRANSPARENT, crossOrigin: true }).addTo(map);
L.control.zoom({ position: 'topright' }).addTo(map);

let tracking=false, paused=false, watchId=null, points=[], distance=0;
let baseElapsed=0, sessionStart=0, currentSpeed=0, maxSpeed=0, lastPos=null, lastTime=0;
let polyline=null, marker=null, followMe=true, wakeLock=null;

const dot=document.getElementById('dot'), gpsText=document.getElementById('gpsText');
const distEl=document.getElementById('dist'), speedEl=document.getElementById('speed'), timeEl=document.getElementById('time');
const btnRow=document.getElementById('btnRow'), toastEl=document.getElementById('toast'), offlineBar=document.getElementById('offlineBar');

function setGPS(s,t){dot.className='dot '+(s||'');gpsText.textContent=t;}
function fmtDist(m){const k=m/1000;return k<1?Math.round(m)+'<small>м</small>':k.toFixed(2)+'<small>км</small>';}
function fmtDistTxt(m){const k=m/1000;return k<1?Math.round(m)+' м':k.toFixed(2)+' км';}
function fmtSpeed(v){return (v*3.6).toFixed(1)+'<small>км/ч</small>';}
function fmtTime(s){s=Math.max(0,Math.floor(s));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),x=s%60,p=n=>String(n).padStart(2,'0');return h>0?h+':'+p(m)+':'+p(x):p(m)+':'+p(x);}
function elapsedNow(){return baseElapsed+(sessionStart?(Date.now()-sessionStart)/1000:0);}
function updateUI(){distEl.innerHTML=fmtDist(distance);speedEl.innerHTML=fmtSpeed(currentSpeed);timeEl.textContent=fmtTime(elapsedNow());}

let toastTimer;
function toast(msg,ms){ms=ms||2200;toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),ms);}

function haversine(a,b){const R=6371000;const f1=a.lat*Math.PI/180,f2=b.lat*Math.PI/180;const df=(b.lat-a.lat)*Math.PI/180,dl=(b.lng-a.lng)*Math.PI/180;const s=Math.sin(df/2)**2+Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(s));}

function onPosition(pos){
  const lat=pos.coords.latitude, lng=pos.coords.longitude, accuracy=pos.coords.accuracy, speed=pos.coords.speed;
  const now=pos.timestamp, point={lat:lat,lng:lng,t:now};
  if(!marker){marker=L.circleMarker([lat,lng],{radius:8,color:'#fff',weight:3,fillColor:'#22c55e',fillOpacity:1}).addTo(map);}
  else marker.setLatLng([lat,lng]);
  if(followMe) map.setView([lat,lng],Math.max(map.getZoom(),16));
  if(!tracking||paused){setGPS('ok','GPS ±'+Math.round(accuracy)+' м');lastPos=point;lastTime=now;return;}
  if(lastPos){
    const d=haversine(lastPos,point),dt=(now-lastTime)/1000;
    if(d>1&&dt>0&&d<dt*40){
      distance+=d;points.push(point);
      if(!polyline){polyline=L.polyline([[lastPos.lat,lastPos.lng],[lat,lng]],{color:'#22c55e',weight:6,opacity:0.9,lineCap:'round'}).addTo(map);}
      else polyline.addLatLng([lat,lng]);
    }
    let sp=0;
    if(typeof speed==='number'&&!isNaN(speed)&&speed>=0) sp=speed;
    else if(dt>0&&d>0) sp=d/dt;
    currentSpeed=sp;
    if(sp>maxSpeed) maxSpeed=sp;
  }
  lastPos=point;lastTime=now;
  setGPS('ok','GPS ±'+Math.round(accuracy)+' м');
  updateUI();
}
function onError(err){setGPS('err','⚠️ '+(err.message||'Ошибка GPS'));}
function startWatch(){
  if(watchId!==null) return;
  if(!navigator.geolocation){setGPS('err','Нет геолокации');return;}
  watchId=navigator.geolocation.watchPosition(onPosition,onError,{enableHighAccuracy:true,maximumAge:1000,timeout:15000});
}
async function requestWakeLock(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&tracking&&!wakeLock)requestWakeLock();});

function renderButtons(){
  btnRow.innerHTML='';
  if(!tracking){
    const b=document.createElement('button');b.className='btn start';b.innerHTML='▶️ Старт';b.onclick=startTracking;btnRow.appendChild(b);
  } else {
    const p=document.createElement('button');p.className='btn '+(paused?'start':'pause');p.innerHTML=paused?'▶️ Далее':'⏸ Пауза';p.onclick=togglePause;btnRow.appendChild(p);
    const s=document.createElement('button');s.className='btn stop';s.innerHTML='⏹ Стоп';s.onclick=stopTracking;btnRow.appendChild(s);
  }
}
function startTracking(){
  tracking=true;paused=false;points=[];distance=0;currentSpeed=0;maxSpeed=0;baseElapsed=0;sessionStart=Date.now();lastPos=null;lastTime=0;followMe=true;
  if(polyline){map.removeLayer(polyline);polyline=null;}
  updateUI();renderButtons();startWatch();requestWakeLock();setGPS('','Ищу GPS...');
}
function togglePause(){
  if(!paused){paused=true;baseElapsed+=(Date.now()-sessionStart)/1000;sessionStart=0;currentSpeed=0;updateUI();setGPS('','⏸ Пауза');}
  else {paused=false;sessionStart=Date.now();lastPos=null;setGPS('','Запись идёт');}
  renderButtons();
}
function stopTracking(){
  if(sessionStart) baseElapsed+=(Date.now()-sessionStart)/1000;
  tracking=false;paused=false;sessionStart=0;currentSpeed=0;updateUI();renderButtons();
  if(points.length>=2&&polyline) map.fitBounds(polyline.getBounds(),{padding:[40,40]});
  if(distance>=50&&points.length>=2){
    saveTrip();
    toast('✅ Поездка сохранена\n'+fmtDistTxt(distance)+' · '+fmtTime(baseElapsed),3500);
    setGPS('ok','Готово: '+fmtDistTxt(distance)+' за '+fmtTime(baseElapsed));
  } else {
    toast('Поездка слишком короткая\nНе сохранена',2500);
  }
}
setInterval(()=>{if(tracking) updateUI();},500);

document.getElementById('locBtn').onclick=()=>{followMe=true;if(lastPos) map.setView([lastPos.lat,lastPos.lng],16);else toast('Нет GPS-сигнала');};
map.on('dragstart',()=>{followMe=false;});
map.on('zoomstart',()=>{followMe=false;});

const STORAGE_KEY='velotracer_trips_v1';
function getTrips(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[];}catch(e){return[];}}
function setTrips(arr){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));}catch(e){while(arr.length>0){arr.pop();try{localStorage.setItem(STORAGE_KEY,JSON.stringify(arr));return;}catch(e2){}}}}
function saveTrip(){
  const trips=getTrips();
  const trip={
    id: Date.now(),
    date: new Date().toISOString(),
    distance: distance,
    duration: baseElapsed,
    avgSpeed: baseElapsed>0?distance/baseElapsed:0,
    maxSpeed: maxSpeed,
    points: points.map(p=>({lat:p.lat,lng:p.lng}))
  };
  trips.unshift(trip);
  if(trips.length>50) trips.length=50;
  setTrips(trips);
}
function fmtDate(iso){
  const d=new Date(iso), now=new Date();
  const today=now.toDateString()===d.toDateString();
  const yesterday=new Date(now.getTime()-86400000).toDateString()===d.toDateString();
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const hh=String(d.getHours()).padStart(2,'0');
  const mi=String(d.getMinutes()).padStart(2,'0');
  if(today) return 'Сегодня, '+hh+':'+mi;
  if(yesterday) return 'Вчера, '+hh+':'+mi;
  return dd+'.'+mm+'.'+d.getFullYear()+' '+hh+':'+mi;
}
let viewPolyline=null;
function showTripOnMap(trip){
  document.getElementById('histModal').classList.remove('show');
  if(viewPolyline){map.removeLayer(viewPolyline);viewPolyline=null;}
  if(polyline){map.removeLayer(polyline);polyline=null;}
  if(!trip.points||trip.points.length<2){toast('Маршрут пустой');return;}
  const latlngs=trip.points.map(p=>[p.lat,p.lng]);
  viewPolyline=L.polyline(latlngs,{color:'#3b82f6',weight:6,opacity:0.9,lineCap:'round'}).addTo(map);
  map.fitBounds(viewPolyline.getBounds(),{padding:[40,40]});
  followMe=false;
  toast('📍 '+fmtDate(trip.date)+'\n'+fmtDistTxt(trip.distance)+' · '+fmtTime(trip.duration),3500);
}
function renderHistory(){
  const trips=getTrips();
  const list=document.getElementById('tripList');
  if(trips.length===0){
    list.innerHTML='<div class="empty">Пока нет сохранённых поездок.<br>Нажми «Старт», покатайся<br>и останови запись.</div>';
    return;
  }
  list.innerHTML='';
  trips.forEach(t=>{
    const el=document.createElement('div');
    el.className='trip';
    const avg=(t.avgSpeed*3.6).toFixed(1);
    const mx=(t.maxSpeed*3.6).toFixed(1);
    el.innerHTML='<div class="info"><div class="date">'+fmtDate(t.date)+'</div><div class="dist">'+fmtDistTxt(t.distance)+'</div><div class="meta">⏱ '+fmtTime(t.duration)+' · ⌀ '+avg+' км/ч · макс '+mx+' км/ч</div></div><button class="del" title="Удалить">🗑</button>';
    el.querySelector('.info').onclick=()=>showTripOnMap(t);
    el.querySelector('.del').onclick=(e)=>{e.stopPropagation();deleteTrip(t.id);};
    list.appendChild(el);
  });
}
function deleteTrip(id){
  if(!confirm('Удалить эту поездку?')) return;
  const trips=getTrips().filter(t=>t.id!==id);
  setTrips(trips);
  renderHistory();
}
document.getElementById('histBtn').onclick=()=>{renderHistory();document.getElementById('histModal').classList.add('show');};
document.getElementById('closeHist').onclick=()=>document.getElementById('histModal').classList.remove('show');
document.getElementById('clearAll').onclick=()=>{
  if(getTrips().length===0){toast('История пуста');return;}
  if(!confirm('Удалить ВСЮ историю поездок?')) return;
  setTrips([]);
  renderHistory();
  toast('История очищена');
};

function latLngToTile(lat,lng,z){const n=2**z;const x=Math.floor((lng+180)/360*n);const lr=lat*Math.PI/180;const y=Math.floor((1-Math.log(Math.tan(lr)+1/Math.cos(lr))/Math.PI)/2*n);return{x,y};}
async function downloadArea(){
  if(!navigator.onLine){toast('❌ Нет интернета');return;}
  const b=map.getBounds();const zooms=[12,13,14,15,16];const urls=[];
  for(const z of zooms){
    const nw=latLngToTile(b.getNorth(),b.getWest(),z), se=latLngToTile(b.getSouth(),b.getEast(),z);
    const x1=Math.min(nw.x,se.x),x2=Math.max(nw.x,se.x),y1=Math.min(nw.y,se.y),y2=Math.max(nw.y,se.y);
    for(let x=x1;x<=x2;x++) for(let y=y1;y<=y2;y++) urls.push('https://tile.openstreetmap.org/'+z+'/'+x+'/'+y+'.png');
  }
  if(urls.length===0){toast('Нечего скачивать');return;}
  let done=0,ok=0,idx=0;
  toast('📥 Загрузка 0/'+urls.length+'…',60000);
  async function worker(){
    while(idx<urls.length){
      const my=idx++;
      try{await fetch(urls[my],{mode:'no-cors',cache:'force-cache'});ok++;}catch(e){}
      done++;
      if(done%10===0||done===urls.length) toast('📥 Загрузка '+done+'/'+urls.length+'…',60000);
    }
  }
  await Promise.all(Array.from({length:6},worker));
  toast('✅ Сохранено '+ok+' тайлов\nКарта доступна офлайн',3500);
}
document.getElementById('dlBtn').onclick=downloadArea;

function updateOnline(){offlineBar.classList.toggle('show',!navigator.onLine);}
window.addEventListener('online',updateOnline);
window.addEventListener('offline',updateOnline);
updateOnline();

renderButtons();updateUI();
</script>
</body>
</html>
